name: The Shark Protocol CI (Lean 4 + Python Matrix)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lean4-formal-proofs:
    name: Lean 4 Formal Verification (38 Theorems, 0 sorry, 0 custom axiom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify zero sorry, custom axiom, or nlinarith tokens and verify #print axioms
        run: |
          python3 -c '
          import pathlib, re
          for name in ("ExistenceVerification.lean", "BoundaryVerification.lean", "TypestateLifecycle.lean"):
              p = pathlib.Path("lean") / name
              txt = p.read_text(encoding="utf-8")
              clean = re.sub(r"/-.*?-/", " ", txt, flags=re.DOTALL)
              clean = re.sub(r"--[^\\n]*", " ", clean)
              assert re.search(r"\\bsorry\\b", clean) is None, f"sorry found in {name}"
              assert re.search(r"\\baxiom\\b", clean) is None, f"custom axiom found in {name}"
              assert re.search(r"\\bnlinarith\\b", clean) is None, f"nlinarith found in {name}"
              thms = re.findall(r"\\btheorem\\s+([A-Za-z0-9_\x27]+)", clean)
              if name == "TypestateLifecycle.lean":
                  for t in thms:
                      assert f"#print axioms {t}" in clean, f"Missing #print axioms for {t}"
          print("All 3 Lean 4 modules (38 theorems) verified free of sorry, custom axiom, and nlinarith.")
          '

      - name: Install elan and build Lean 4 targets
        uses: leanprover/lean-action@f807b338d95de7813c5c50d018f1c23c9b93b4ec # v1.2.0
        with:
          build-args: ExistenceVerification BoundaryVerification TypestateLifecycle

  python-verification-matrix:
    name: Python Gateway, 4D ODE, LRSC & Red-Team Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify SHA-256 Manifest
        run: sha256sum -c MANIFEST_SHA256.txt

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Unit & Red-Team Suite (30 Tests)
        run: pytest -v tests/

      - name: Run CLI Lifecycle & Red-Team Audit
        run: python -m shark_protocol.cli --cli --audit-lifecycle
