name: The Shark Protocol CI (Lean 4 + Python Matrix)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lean4-formal-proofs:
    name: Lean 4 Formal Verification (34 Theorems, 0 sorry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify zero sorry or axiom tokens in Lean modules
        run: |
          python3 -c '
          import pathlib, re
          for name in ("ExistenceVerification.lean", "BoundaryVerification.lean", "TypestateLifecycle.lean"):
              p = pathlib.Path("lean") / name
              txt = p.read_text(encoding="utf-8")
              clean = re.sub(r"/-.*?-/", " ", txt, flags=re.DOTALL)
              clean = re.sub(r"--[^\\n]*", " ", clean)
              assert re.search(r"\\bsorry\\b", clean) is None, f"sorry found in {name}"
              assert re.search(r"\\bnlinarith\\b", clean) is None, f"nlinarith found in {name}"
          print("All 3 Lean 4 modules verified free of sorry and nlinarith.")
          '

      - name: Install elan and build Lean 4 targets
        uses: leanprover/lean-action@v1
        with:
          build-args: ExistenceVerification BoundaryVerification TypestateLifecycle

  python-verification-matrix:
    name: Python Gateway, 4D ODE, LRSC & Red-Team Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA-256 Manifest
        run: sha256sum -c MANIFEST_SHA256.txt

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Unit & Red-Team Suite (20 Tests)
        run: pytest -v tests/

      - name: Run CLI Lifecycle & Red-Team Audit
        run: python -m shark_protocol.cli --cli --audit-lifecycle
