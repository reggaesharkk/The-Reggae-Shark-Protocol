name: Shark Protocol Verification & Lean 4 CI (v1.3.1)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python-verification-and-manifest:
    name: Python 3.11 & 3.12 Verification + Manifest Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify UTF-8 without BOM, LF line endings, and MANIFEST_SHA256.txt
        run: |
          sha256sum -c MANIFEST_SHA256.txt
          python3 tools/check_lean_axioms.py --source-only

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full 38-test unit, red-team, differential & axiom suite
        run: |
          python -m unittest discover -s tests -v

      - name: Run CLI lifecycle and red-team self-audit
        run: |
          python -m shark_protocol.cli --cli --audit-lifecycle

  lean4-formal-proofs-and-axioms:
    name: Lean 4 (41 Theorems + AxiomsCheck Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install elan and build 41 zero-sorry Lean 4 theorems
        uses: leanprover/lean-action@f807b338d95de7813c5c50d018f1c23c9b93b4ec # v1.2.0
        with:
          build-args: ExistenceVerification BoundaryVerification TypestateLifecycle AxiomsCheck

      - name: Capture lake env lean lean/AxiomsCheck.lean and verify axiom subset
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean lean/AxiomsCheck.lean | tee /tmp/lean_axioms_output.txt
          python3 tools/check_lean_axioms.py /tmp/lean_axioms_output.txt
