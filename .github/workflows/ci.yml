name: The Shark Protocol CI (Lean 4 + Python Matrix)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lean4-formal-proofs:
    name: Lean 4 Formal Verification (31 Theorems, 0 sorry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and verify Lean 4 modules via Lake
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || true
          lake build BoundaryVerification ExistenceVerification TypestateLifecycle | tee lean_build.log
          grep -q "Build completed successfully" lean_build.log
          ! grep -q "sorryAx" lean_build.log

  python-test-matrix:
    name: Python Gateway, 4D ODE, LRSC & Red-Team Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA-256 Manifest
        run: |
          sha256sum -c MANIFEST_SHA256.txt

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install . pytest

      - name: Run Pytest Unit & Red-Team Suite
        run: |
          pytest -v tests/
          shark-protocol --cli --audit-php2shell
